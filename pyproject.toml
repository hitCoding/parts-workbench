[project]
name = "parts-workbench"
version = "1.0.0"
description = "料格：个人电子物料工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1,<4",
    "argon2-cffi>=23,<26",
    "segno>=1.6,<2",
    "pillow>=11,<13",
    "xlrd>=2.0,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
